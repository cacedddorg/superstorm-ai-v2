version: '3.8'

services:
  market-engine:
    build: 
      context: ./services/market-engine
    ports:
      - "8000:8000"
    environment:
      - ENV=development
    volumes:
      - ./services/market-engine:/app

  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/orderbook
      - AUTH_USER=${AUTH_USER:?Set AUTH_USER in the project .env file}
      - AUTH_PASSWORD=${AUTH_PASSWORD:?Set AUTH_PASSWORD in the project .env file}
    volumes:
      - ./apps/web:/app
      - /app/node_modules
