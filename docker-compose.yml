services:
  market-engine:
    profiles: ["continuous-feed"]
    build:
      context: ./services/market-engine
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ENV=development
      - MARKET_API_SIGNING_SECRET=${MARKET_API_SIGNING_SECRET:?Set MARKET_API_SIGNING_SECRET in the project .env file}
    volumes:
      - ./services/market-engine:/app

  web:
    build:
      context: ./apps/web
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      AUTH_USER: ${AUTH_USER:?Set AUTH_USER in the project .env file}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD in the project .env file}
