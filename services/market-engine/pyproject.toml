[project]
name = "superstorm-market-engine"
version = "0.1.0"
description = "Private, free-exchange-data cryptocurrency research market engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.111.0",
  "uvicorn[standard]==0.30.1",
  "pydantic-settings==2.3.4",
  "httpx==0.27.0",
  "websockets==12.0",
]

[project.optional-dependencies]
dev = ["pytest==8.2.2", "pytest-asyncio==0.23.7"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
asyncio_mode = "auto"
